<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Time Before You Die</title>
<style>
:root{--blood:#c1121f;--glow:#ff2a36;--bone:#d9d2c5;--dim:#4a1216;--mute:#8a7a7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:#000;color:var(--bone);overflow-x:hidden}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:"Courier New",Courier,monospace;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#blood{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.25;transition:opacity .45s;background:radial-gradient(ellipse at center,transparent 30%,rgba(120,0,8,.55) 75%,#000 100%)}
#grain{position:fixed;inset:-20px;pointer-events:none;z-index:3;opacity:.09;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
main{position:relative;z-index:4;width:100%;max-width:660px;padding:24px 16px;text-align:center}
h1{margin:0 0 8px;font:700 clamp(22px,6.5vw,36px)/1.2 Georgia,"Times New Roman",serif;letter-spacing:.06em;color:var(--bone);text-shadow:0 0 18px rgba(193,18,31,.6)}
.hide{display:none!important}
.gate,.scan{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:18px}
.gate p{margin:0;color:var(--mute);font-size:clamp(14px,4vw,17px)}
input{width:100%;max-width:340px;background:#050000;border:1px solid var(--dim);border-bottom:2px solid var(--blood);color:var(--bone);font:20px "Courier New",monospace;text-align:center;padding:14px 10px;border-radius:2px;outline:none;user-select:text;-webkit-user-select:text}
input:focus{box-shadow:0 0 20px rgba(255,42,54,.35)}
button{background:var(--blood);color:#000;border:0;font:700 18px Impact,"Arial Black",sans-serif;letter-spacing:.1em;padding:12px 36px;border-radius:2px;cursor:pointer}
button:active{background:var(--glow)}
.err{color:var(--glow);font-size:13px;min-height:1.2em}
#log{min-height:110px;text-align:left;color:var(--mute);font-size:15px;line-height:1.9}
#log b{color:var(--blood);font-weight:400}
.pb{width:100%;max-width:340px;height:3px;background:#1a0507}.pb i{display:block;height:100%;width:0;background:var(--blood);box-shadow:0 0 10px var(--glow);transition:width .8s linear}
#who{margin:6px 0 4px;color:var(--blood);font:700 clamp(26px,8vw,42px)/1.1 Georgia,serif;word-break:break-word;text-shadow:0 0 16px rgba(255,42,54,.5)}
.sub{margin:0 0 6px;color:var(--mute);font-size:clamp(13px,3.6vw,16px);min-height:1.6em;transition:opacity .4s}
.end{margin:0 0 22px;color:#6b4a4a;font-size:13px}
.clock{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 8px}
.cell{width:calc((100% - 24px)/4);min-width:68px;max-width:130px;padding:12px 0 8px;border:1px solid var(--dim);background:linear-gradient(#0d0000,#000);border-radius:4px}
.cell b{display:block;font:400 clamp(36px,10.5vw,60px)/1 Impact,"Arial Black",sans-serif;font-variant-numeric:tabular-nums;color:var(--blood);text-shadow:0 0 14px rgba(255,42,54,.45)}
.cell span{display:block;margin-top:6px;font-size:12px;color:var(--mute)}
#ms{margin-top:22px;font:400 clamp(22px,6vw,32px) Impact,sans-serif;font-variant-numeric:tabular-nums;color:#5a1519;letter-spacing:.12em}
.bar{margin:20px auto 0;height:2px;background:#1a0507;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:var(--blood);transform-origin:left;will-change:transform;box-shadow:0 0 10px var(--glow)}
.foot{margin-top:26px;font-size:12px;color:#4a3030;min-height:1.4em}
#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:6;background:transparent;color:#5a3a3a;font:13px "Courier New",monospace;padding:6px 8px;letter-spacing:0}
#scare{position:fixed;inset:0;z-index:8;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;color:var(--glow);font:700 clamp(40px,15vw,110px)/1 Georgia,serif;word-break:break-word}
#scare small{display:block;margin-top:16px;font:400 clamp(16px,5vw,26px) "Courier New",monospace;color:var(--bone)}
#joke{position:fixed;inset:0;z-index:9;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:24px;font-size:clamp(24px,7.5vw,42px)}
#joke small{font-size:15px;color:var(--mute)}
#joke div{display:flex;gap:12px}
#joke button{font-size:15px;padding:10px 20px}
.shake{transform:translate(var(--sx,0),var(--sy,0))}
</style>
</head>
<body>
<div id="blood"></div><div id="grain"></div>
<button id="snd" class="hide" type="button">sound: on</button>
<main id="stage">
  <h1 id="title">Time before you die</h1>

  <form class="gate" id="gate" autocomplete="off" onsubmit="return false">
    <p>Type your real name to see how long you have left.</p>
    <input id="nm" type="text" maxlength="40" placeholder="Your full name" aria-label="Your real name">
    <div class="err" id="err"></div>
    <button type="button" id="go">BEGIN</button>
  </form>

  <section class="scan hide" id="scan">
    <div id="log"></div>
    <div class="pb"><i id="pb"></i></div>
  </section>

  <section id="run" class="hide">
    <div id="who"></div>
    <p class="sub" id="msg"></p>
    <p class="end" id="end"></p>
    <div class="clock" id="clock"></div>
    <div id="ms">.000</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="foot" id="foot">Do not close this page.</div>
  </section>
</main>

<div id="scare"><span id="scn"></span><small id="scs">I can see you.</small></div>
<div id="joke">Just a prank 😂<small>Nothing is going to happen. Go laugh with your friend.</small>
  <div><button type="button" id="jc">CLOSE</button><button type="button" id="jr">RESET</button></div>
</div>

<script>
(function(){
  var S=1000,MI=60*S,H=60*MI,D=24*H,W=7*D,MO=30*D,Y=365*D;
  var KEY="tbyd_end_v3",NKEY="tbyd_name_v3";
  var $=function(i){return document.getElementById(i)};
  var name="",end=0,total=1,started=false,over=false,scared=false,lines,muted=false;

  /* ---------- audio ---------- */
  var AC=null,master=null;
  function initAudio(){
    if(AC)return;
    try{
      AC=new(window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);
      [[55,.045,"sine"],[55.8,.04,"sine"],[82.4,.012,"triangle"]].forEach(function(p){
        var o=AC.createOscillator(),g=AC.createGain();o.type=p[2];o.frequency.value=p[0];g.gain.value=p[1];
        o.connect(g);g.connect(master);o.start();
      });
      if(AC.state==="suspended")AC.resume();
    }catch(e){AC=null}
  }
  function thump(vol,f){
    if(!AC)return;
    var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(30,t+.2);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+.3);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+.32);
  }
  function burst(){
    if(!AC)return;
    var n=AC.sampleRate*.7,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
    var s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=.9;s.connect(g);g.connect(master);s.start();
    thump(1,140);
  }
  function vib(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
  $("snd").addEventListener("click",function(){
    muted=!muted;if(master)master.gain.value=muted?0:.9;this.textContent="sound: "+(muted?"off":"on");
  });

  /* ---------- heartbeat + blood pulse ---------- */
  var blood=$("blood");
  function heart(){
    if(over)return;
    var r=Math.max(end-Date.now(),0),k=1-Math.min(r/total,1);
    thump(.9,92);vib(35);blood.style.opacity=.75;
    setTimeout(function(){thump(.6,76);blood.style.opacity=.25},240);
    setTimeout(heart,1000-k*380);
  }

  /* ---------- timer ---------- */
  var units=["years","months","weeks","days","hours","min","sec"],els=[],last=[];
  var clock=$("clock"),msEl=$("ms"),bar=$("bar");
  units.forEach(function(u,i){
    var c=document.createElement("div");c.className="cell";
    c.innerHTML="<b>00</b><span>"+u+"</span>";clock.appendChild(c);els.push(c.firstChild);last.push("");
  });
  var lastTitle="";
  function pad(n){return n<10?"0"+n:""+n}
  function tick(){
    var r=end-Date.now();if(r<0)r=0;
    var v=[],x=r;
    v.push(Math.floor(x/Y));x%=Y;v.push(Math.floor(x/MO));x%=MO;v.push(Math.floor(x/W));x%=W;
    v.push(Math.floor(x/D));x%=D;v.push(Math.floor(x/H));x%=H;v.push(Math.floor(x/MI));x%=MI;v.push(Math.floor(x/S));
    for(var i=0;i<7;i++){var s=pad(v[i]);if(s!==last[i]){els[i].textContent=s;last[i]=s}}
    var ms=r%S;msEl.textContent="."+(ms<10?"00"+ms:ms<100?"0"+ms:ms);
    bar.style.transform="scaleX("+(r/total)+")";
    var t="\u{1F480} "+pad(v[3])+"d "+pad(v[4])+"h "+pad(v[5])+"m "+pad(v[6])+"s";
    if(t!==lastTitle){document.title=t;lastTitle=t}
    if(r===0&&!over){over=true;document.title="Just kidding";showJoke(true);return}
    requestAnimationFrame(tick);
  }

  /* ---------- creepy text ---------- */
  lines=["It started the moment you typed your name.","Someone is already looking for you, {n}.","Closing the tab will not stop it.","Check behind you, {n}.","It knows your name, {n}.","Every second counts. Every second is gone.","You felt that, didn't you?","Don't look at the door, {n}.","Why are you still here?","Your screen just got colder.","Listen. Can you hear it?","{n}. {n}. {n}."];
  var feet=["Do not close this page.","It's quieter than usual.","Turn around slowly.","Refreshing won't reset it.","Almost nobody finishes reading this.","Don't tell anyone."];
  var msg=$("msg"),foot=$("foot"),li=0;
  function say(){
    if(over)return;
    msg.style.opacity=0;
    setTimeout(function(){
      li=(li+1+Math.floor(Math.random()*3))%lines.length;
      msg.textContent=lines[li].split("{n}").join(name);
      foot.textContent=feet[Math.floor(Math.random()*feet.length)];
      msg.style.opacity=1;
    },400);
    setTimeout(say,6000+Math.random()*3000);
  }

  /* ---------- glitch + shake ---------- */
  var stage=$("stage");
  function glitch(){
    if(over)return;
    var n=0,iv=setInterval(function(){
      var dx=(Math.random()*10-5).toFixed(1),dy=(Math.random()*4-2).toFixed(1);
      stage.style.transform="translate("+dx+"px,"+dy+"px)";
      clock.style.textShadow=(-dx)+"px 0 #0ff,"+dx+"px 0 #f00";
      blood.style.opacity=Math.random()>.5?.7:.2;
      if(++n>5){clearInterval(iv);stage.style.transform="";clock.style.textShadow="";blood.style.opacity=.25}
    },40);
    setTimeout(glitch,3500+Math.random()*7000);
  }

  /* ---------- the one scare ---------- */
  function scare(){
    if(over||scared)return;scared=true;
    $("scn").textContent=name;$("scs").textContent=["I can see you.","Turn around.","Found you."][Math.floor(Math.random()*3)];
    var sc=$("scare");sc.style.display="flex";burst();vib([200,80,200,80,400]);
    var n=0,iv=setInterval(function(){
      sc.style.transform="translate("+(Math.random()*24-12)+"px,"+(Math.random()*24-12)+"px)";
      sc.style.background=n%2?"#000":"#2a0000";
      if(++n>22){clearInterval(iv);sc.style.display="none";sc.style.transform=""}
    },60);
  }

  /* ---------- flow ---------- */
  function showRun(){
    $("scan").classList.add("hide");$("run").classList.remove("hide");$("snd").classList.remove("hide");
    $("who").textContent=name;
    var dt=new Date(end),when="";
    try{when=dt.toLocaleString([],{weekday:"long",day:"numeric",month:"long",hour:"numeric",minute:"2-digit"})}catch(e){when=dt.toString()}
    $("end").textContent="Final moment: "+when+". Cause: unknown.";
    total=Math.max(end-Date.now(),1);
    msg.textContent=lines[0].split("{n}").join(name);
    requestAnimationFrame(tick);heart();
    setTimeout(say,6000);setTimeout(glitch,2500);
    if(!scared)setTimeout(scare,25000+Math.random()*35000);
    try{if(navigator.wakeLock)navigator.wakeLock.request("screen").catch(function(){})}catch(e){}
  }
  function scan(){
    $("gate").classList.add("hide");$("scan").classList.remove("hide");
    var steps=["Reading name: <b>"+esc(name)+"</b>","Locating you...","Listening for your heartbeat...","Counting what is left...","Time found."],log=$("log"),pb=$("pb"),i=0;
    log.innerHTML="";
    (function next(){
      if(i>=steps.length){setTimeout(showRun,900);return}
      log.innerHTML+=steps[i]+"<br>";pb.style.width=((i+1)/steps.length*100)+"%";thump(.5,70);vib(25);i++;
      setTimeout(next,900+Math.random()*500);
    })();
  }
  function esc(s){return s.replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function submit(){
    var v=$("nm").value.trim().replace(/\s+/g," ");
    if(v.length<2){$("err").textContent="Enter your real name. It won't work with a fake one.";return}
    name=v;end=Date.now()+Math.floor((2.5+Math.random()*4)*D);
    try{localStorage.setItem(KEY,String(end));localStorage.setItem(NKEY,name)}catch(e){}
    initAudio();
    try{var el=document.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el)}catch(e){}
    started=true;scan();
  }
  $("go").addEventListener("click",submit);
  $("nm").addEventListener("keydown",function(e){if(e.key==="Enter")submit()});

  // returning visitor: resume the same countdown
  try{
    var se=parseInt(localStorage.getItem(KEY),10),sn=localStorage.getItem(NKEY);
    if(se&&sn&&se>Date.now()){
      end=se;name=sn;started=true;
      $("gate").classList.add("hide");showRun();
      var once=function(){initAudio();document.removeEventListener("pointerdown",once)};
      document.addEventListener("pointerdown",once);
    }
  }catch(e){}

  /* ---------- prank reveal ---------- */
  function showJoke(ended){
    if(ended)$("joke").firstChild.nodeValue="Time's up... just kidding 😂";
    $("joke").style.display="flex";
  }
  var taps=0,tt;
  $("title").addEventListener("click",function(){
    taps++;clearTimeout(tt);tt=setTimeout(function(){taps=0},1500);
    if(taps>=5){taps=0;showJoke(false)}
  });
  $("jc").addEventListener("click",function(){$("joke").style.display="none"});
  $("jr").addEventListener("click",function(){try{localStorage.removeItem(KEY);localStorage.removeItem(NKEY)}catch(e){}location.reload()});
})();
</script>
</body>
</html>
